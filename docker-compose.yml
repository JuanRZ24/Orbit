services:
  orbit:
    build: .
    image: orbit-server
    restart: unless-stopped
    # ORBIT_PASSWORD vive aquí, fuera del repo.
    env_file: .env
    environment:
      ORBIT_DATA: /datos
      ORBIT_PORT: "8787"
    volumes:
      - orbit-datos:/datos
    # Solo escucha en local: quien habla con internet es nginx, no esto.
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  orbit-datos:
